<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101b">
  <title>Language | MUVY</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="language.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="language-body">
  <main class="language-shell">
    <header class="language-header">
      <a class="page-back" href="profile.html" aria-label="Back to Profile" title="Back to Profile">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 data-l10n="Language">Language</h1>
    </header>
    <section class="language-content" aria-labelledby="language-heading">
      <h2 id="language-heading" data-l10n="Choose your language">Choose your language</h2>
      <p data-l10n="Your selection will be used throughout MUVY.">Your selection will be used throughout MUVY.</p>
      <div class="language-list" id="language-list" role="group" aria-label="Available languages">
        <button class="language-choice" type="button" data-language="en" aria-pressed="false"><span class="language-name" data-l10n-skip>English</span><span class="language-native" data-l10n-skip>English</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="es" aria-pressed="false"><span class="language-name" data-l10n-skip>Español</span><span class="language-native" data-l10n-skip>Spanish</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="fr" aria-pressed="false"><span class="language-name" data-l10n-skip>Français</span><span class="language-native" data-l10n-skip>French</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="de" aria-pressed="false"><span class="language-name" data-l10n-skip>Deutsch</span><span class="language-native" data-l10n-skip>German</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="pt" aria-pressed="false"><span class="language-name" data-l10n-skip>Português</span><span class="language-native" data-l10n-skip>Portuguese</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="ar" aria-pressed="false"><span class="language-name" data-l10n-skip>العربية</span><span class="language-native" data-l10n-skip>Arabic</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="zh-Hans" aria-pressed="false"><span class="language-name" data-l10n-skip>简体中文</span><span class="language-native" data-l10n-skip>Chinese (Simplified)</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="hi" aria-pressed="false"><span class="language-name" data-l10n-skip>हिन्दी</span><span class="language-native" data-l10n-skip>Hindi</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="ja" aria-pressed="false"><span class="language-name" data-l10n-skip>日本語</span><span class="language-native" data-l10n-skip>Japanese</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="ko" aria-pressed="false"><span class="language-name" data-l10n-skip>한국어</span><span class="language-native" data-l10n-skip>Korean</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="it" aria-pressed="false"><span class="language-name" data-l10n-skip>Italiano</span><span class="language-native" data-l10n-skip>Italian</span><span class="language-check" aria-hidden="true">✓</span></button>
        <button class="language-choice" type="button" data-language="sw" aria-pressed="false"><span class="language-name" data-l10n-skip>Kiswahili</span><span class="language-native" data-l10n-skip>Swahili</span><span class="language-check" aria-hidden="true">✓</span></button>
      </div>
    </section>
  </main>
  <script src="i18n.js" defer></script>
  <script src="language.js" defer></script>
</body>
</html>
