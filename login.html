<!doctype html>
<!-- Shared sign-in and sign-up page with mode selection and form feedback. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080611">
  <title>Log in to MUVY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a class="auth-back" href="index.html" aria-label="Back to welcome page" title="Back to welcome page"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <section class="auth-panel" aria-labelledby="auth-title">
        <a class="splash-wordmark auth-brand" href="index.html" aria-label="MUVY welcome page"><span>M</span><span>U</span><span class="splash-v">V</span><span>Y</span></a>
        <div class="auth-tabs" role="group" aria-label="Account access">
          <button class="auth-tab is-active" type="button" aria-pressed="true" data-mode="login">Log in</button>
          <button class="auth-tab" type="button" aria-pressed="false" data-mode="signup">Sign up</button>
        </div>
        <h1 id="auth-title">Welcome back.</h1>
        <p class="auth-description" id="auth-description">Log in to continue discovering what to watch.</p>
        <form class="auth-form" id="auth-form">
          <label class="auth-field" id="name-field" for="name" hidden>Your name
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name">
          </label>
          <label class="auth-field" for="email">Email address
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </label>
          <label class="auth-field" for="password">Password
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          </label>
          <label class="auth-field" id="confirm-password-field" for="confirm-password" hidden>Confirm password
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter your password again">
          </label>
          <button class="primary-link auth-submit" id="auth-submit" type="submit">Log in</button>
          <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-footnote">Demo sign-in only: your name and email stay on this device for up to 8 hours. Your password is never saved or sent.</p>
      </section>
    </div>
  </main>
  <script src="auth.js" defer></script>
</body>
</html>
