<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080611">
  <title>Log in to MUVY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a class="auth-back" href="index.html">Back to welcome page</a>
      <section class="auth-panel" aria-labelledby="auth-title">
        <a class="wordmark auth-brand" href="index.html" aria-label="MUVY welcome page"><span class="wordmark-mark" aria-hidden="true">M</span>MUVY</a>
        <div class="auth-tabs" role="group" aria-label="Account access">
          <button class="auth-tab is-active" type="button" aria-pressed="true" data-mode="login">Log in</button>
          <button class="auth-tab" type="button" aria-pressed="false" data-mode="signup">Sign up</button>
        </div>
        <h1 id="auth-title">Welcome back.</h1>
        <p class="auth-description" id="auth-description">Log in to continue discovering what to watch.</p>
        <form class="auth-form" id="auth-form">
          <label class="auth-field" id="name-field" for="name" hidden>First name
            <input id="name" name="name" type="text" autocomplete="given-name" placeholder="Your name">
          </label>
          <label class="auth-field" for="email">Email address
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </label>
          <label class="auth-field" for="password">Password
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          </label>
          <button class="primary-link auth-submit" id="auth-submit" type="submit">Log in</button>
          <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-footnote">Account access is not connected yet. Your details will not be sent anywhere.</p>
      </section>
    </div>
  </main>
  <script>
    const form = document.getElementById('auth-form');
    const tabs = document.querySelectorAll('.auth-tab');
    const nameField = document.getElementById('name-field');
    const nameInput = document.getElementById('name');
    const passwordInput = document.getElementById('password');
    const title = document.getElementById('auth-title');
    const description = document.getElementById('auth-description');
    const submit = document.getElementById('auth-submit');
    const message = document.getElementById('auth-message');
    let mode = 'login';

    function setMode(nextMode) {
      mode = nextMode === 'signup' ? 'signup' : 'login';
      const signingUp = mode === 'signup';
      nameField.hidden = !signingUp;
      nameInput.required = signingUp;
      passwordInput.autocomplete = signingUp ? 'new-password' : 'current-password';
      title.textContent = signingUp ? 'Make yourself at home.' : 'Welcome back.';
      description.textContent = signingUp
        ? 'Create an account and keep every discovery close.'
        : 'Log in to continue discovering what to watch.';
      submit.textContent = signingUp ? 'Create account' : 'Log in';
      message.textContent = '';
      tabs.forEach((tab) => {
        const active = tab.dataset.mode === mode;
        tab.classList.toggle('is-active', active);
        tab.setAttribute('aria-pressed', String(active));
      });
      document.title = signingUp ? 'Sign up for MUVY' : 'Log in to MUVY';
    }

    tabs.forEach((tab) => tab.addEventListener('click', () => setMode(tab.dataset.mode)));
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      message.textContent = mode === 'signup'
        ? 'Account creation is not available yet. Please check back soon.'
        : 'Sign in is not available yet. Please check back soon.';
    });

    setMode(window.location.hash === '#signup' ? 'signup' : 'login');
  </script>
</body>
</html>
